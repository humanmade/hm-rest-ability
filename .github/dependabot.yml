version: 2
updates:
    - package-ecosystem: composer
      directory: "/"
      schedule:
          interval: weekly
      open-pull-requests-limit: 10
      labels:
          - dependencies
      groups:
          composer-dependencies:
              patterns:
                  - "*"
    - package-ecosystem: npm
      directory: "/"
      schedule:
          interval: weekly
      open-pull-requests-limit: 10
      labels:
          - dependencies
      groups:
          npm-dependencies:
              patterns:
                  - "*"
    - package-ecosystem: github-actions
      directory: "/"
      schedule:
          interval: weekly
      labels:
          - dependencies
      groups:
          github-actions:
              patterns:
                  - "*"
