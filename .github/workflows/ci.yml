name: CI

on:
    push:
        branches: [main]
    # No branch filter: a pull request stacked on another feature branch
    # needs checks too, not just once it retargets main.
    pull_request:

jobs:
    lint:
        name: PHPCS
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Set up PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.2'
                  tools: composer:v2
                  coverage: none

            - name: Install Composer dependencies
              uses: ramsey/composer-install@v4

            - name: Run PHPCS
              run: composer lint

    test:
        name: PHPUnit (PHP ${{ matrix.php }})
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                # humanmade/coding-standards (a require-dev tool, not a
                # runtime dependency) needs PHP >=8.2, which is why this
                # matrix doesn't reach down to the plugin's own "Requires
                # PHP: 7.4". PHP 7.4 compatibility is checked statically
                # instead, via the PHPCompatibilityWP sniff in `composer lint`.
                php: ['8.2', '8.3', '8.4']
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Set up PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}
                  tools: composer:v2
                  coverage: none

            - name: Install Composer dependencies
              uses: ramsey/composer-install@v4

            - name: Run PHPUnit
              run: composer test

    evals:
        name: Eval harness (scripted)
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            # Replays fixed tool calls instead of asking a model, so this
            # costs nothing and is safe to run on pull requests, including
            # ones from forks. It checks the harness itself: the MCP
            # connection, tool discovery, the turn loop, and every scenario's
            # setup and grading.
            - name: Run the scripted evals
              run: npm run test:evals:scripted
              env:
                  WP_PLAYGROUND_PORT: 9401
