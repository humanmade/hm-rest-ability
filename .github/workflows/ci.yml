name: CI

on:
    push:
        branches: [main]
    # No branch filter: a pull request stacked on another feature branch
    # needs checks too, not just once it retargets main.
    pull_request:

jobs:
    lint:
        name: PHPCS
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Set up PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.2'
                  tools: composer:v2
                  coverage: none

            - name: Install Composer dependencies
              uses: ramsey/composer-install@v4

            - name: Run PHPCS
              run: composer lint

    test:
        name: PHPUnit (PHP ${{ matrix.php }})
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                # Starts at the plugin's own minimum, "Requires PHP: 8.2".
                php: ['8.2', '8.3', '8.4']
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Set up PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}
                  tools: composer:v2
                  coverage: none

            - name: Install Composer dependencies
              uses: ramsey/composer-install@v4

            - name: Run PHPUnit
              run: composer test
